[project]
name = "stockledger"
version = "0.1.0"
description = "Deterministic US stock factor scoring with an auditable, self-grading call ledger. Built to be driven by Claude Code."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.50",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
stockledger = "stockledger.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
